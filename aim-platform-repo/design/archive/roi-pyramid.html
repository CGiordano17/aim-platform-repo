<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #030507; font-family: 'Rajdhani', sans-serif; color: #E7EEF2; }
  .stage { min-height: 700px; padding: 30px 26px 40px; background: #030507;
    background-image: linear-gradient(rgba(94,230,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(94,230,255,0.03) 1px, transparent 1px);
    background-size: 26px 26px; }
  .head { text-align: center; padding: 4px 0 10px; }
  .head h1 { font-family: 'Michroma', sans-serif; font-size: 16px; margin: 0; letter-spacing: 0.04em; }
  .head h1 span { color: #5EE6FF; }
  .head p { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #6E8790; margin: 8px 0 0; }
  .legend { display: flex; justify-content: center; gap: 18px; margin: 14px 0 6px; flex-wrap: wrap; }
  .legend .l { display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: #9FB6BC; text-transform: uppercase; letter-spacing: 0.03em; }
  .legend .dot { width: 8px; height: 8px; border-radius: 2px; }
  .nodebox rect.card { fill: rgba(10,16,20,0.92); stroke-width: 1; }
  .nodebox .c { stroke: currentColor; opacity: 0.9; }
  .lbl-main { font-family: 'Rajdhani', sans-serif; font-weight: 600; }
  .lbl-sub { font-family: 'JetBrains Mono', monospace; }
  .lvl-label { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; fill: #45585e; }
</style>

<div class="stage">
  <div class="head">
    <h1>USE CASE ROI PYRAMID / <span>AIM</span></h1>
    <p>GRANULAR TASKS ROLL UP INTO ENTERPRISE OUTCOMES — TRACE ANY FUNCTION'S THREAD UPWARD</p>
  </div>
  <div class="legend" id="legend"></div>
  <svg id="pyramid" viewBox="0 0 1000 610" width="100%" style="max-width:1100px; display:block; margin:0 auto;"></svg>
</div>

<script>
(function() {
  var svg = document.getElementById('pyramid');
  var ns = 'http://www.w3.org/2000/svg';

  var colors = {
    Sales: '#5EE6FF', Support: '#7FE0A0', Engineering: '#F0A94E', Finance: '#C79EF0', HR: '#F08FB0'
  };

  var legend = document.getElementById('legend');
  Object.keys(colors).forEach(function(k) {
    legend.innerHTML += '<div class="l"><span class="dot" style="background:' + colors[k] + '"></span>' + k + '</div>';
  });

  // ---- node definitions per level (bottom = 0, apex = highest) ----
  var L0 = [
    { id: 'sc1', fn: 'Sales', label: 'Sales proposal drafting', sub: '62% adoption', x: 80 },
    { id: 'sc2', fn: 'Sales', label: 'Client renewal risk scoring', sub: '41% adoption', x: 195 },
    { id: 'su1', fn: 'Support', label: 'Ticket first-response drafting', sub: '74% adoption', x: 315 },
    { id: 'en1', fn: 'Engineering', label: 'Code review summarization', sub: '68% adoption', x: 435 },
    { id: 'en2', fn: 'Engineering', label: 'Incident report triage', sub: '55% adoption', x: 550 },
    { id: 'fi1', fn: 'Finance', label: 'Expense report coding', sub: '38% adoption', x: 665 },
    { id: 'hr1', fn: 'HR', label: 'Job description drafting', sub: '80% adoption', x: 785 },
    { id: 'hr2', fn: 'HR', label: 'Onboarding buddy matching', sub: '29% adoption', x: 900 }
  ];
  var L1 = [
    { id: 'sales-v', fn: 'Sales', label: 'Sales cycle velocity', sub: 'rolls up 2 use cases', parents: ['sc1','sc2'] },
    { id: 'sup-v', fn: 'Support', label: 'Support resolution speed', sub: 'rolls up 1 use case', parents: ['su1'] },
    { id: 'eng-v', fn: 'Engineering', label: 'Engineering throughput', sub: 'rolls up 2 use cases', parents: ['en1','en2'] },
    { id: 'fin-v', fn: 'Finance', label: 'Finance processing accuracy', sub: 'rolls up 1 use case', parents: ['fi1'] },
    { id: 'hr-v', fn: 'HR', label: 'Time-to-hire & onboarding speed', sub: 'rolls up 2 use cases', parents: ['hr1','hr2'] }
  ];
  var L2 = [
    { id: 'cx', fn: null, label: 'Customer experience', sub: 'Sales + Support merge here', parents: ['sales-v','sup-v'] },
    { id: 'opx', fn: null, label: 'Operational efficiency', sub: 'Eng + Finance merge here', parents: ['eng-v','fin-v'] },
    { id: 'tc', fn: 'HR', label: 'Talent & culture', sub: 'HR thread continues alone', parents: ['hr-v'] }
  ];
  var L3 = [
    { id: 'rev', fn: null, label: 'Revenue growth', sub: 'enterprise ROI', parents: ['cx','opx'] },
    { id: 'ret', fn: null, label: 'Retention & cost savings', sub: 'enterprise ROI', parents: ['opx','tc'] }
  ];

  function centerX(node, byId) {
    if (node.x != null) return node.x;
    var xs = node.parents.map(function(p) { return byId[p].x; });
    return xs.reduce(function(a,b){return a+b;}, 0) / xs.length;
  }

  var byId = {};
  L0.forEach(function(n){ byId[n.id] = n; });
  var Y = { 0: 520, 1: 380, 2: 240, 3: 100 };
  [L1, L2, L3].forEach(function(level) {
    level.forEach(function(n) { n.x = centerX(n, byId); byId[n.id] = n; });
  });

  // background pyramid outline
  var tri = document.createElementNS(ns, 'path');
  tri.setAttribute('d', 'M 30 555 L 970 555 L 500 40 Z');
  tri.setAttribute('fill', 'none');
  tri.setAttribute('stroke', 'rgba(94,230,255,0.1)');
  tri.setAttribute('stroke-dasharray', '4 5');
  svg.appendChild(tri);

  // level labels
  var levelLabels = ['USE CASES / TASKS', 'FUNCTIONAL METRICS', 'CROSS-FUNCTIONAL OUTCOMES', 'ENTERPRISE ROI'];
  [0,1,2,3].forEach(function(l) {
    var t = document.createElementNS(ns, 'text');
    t.setAttribute('x', 20); t.setAttribute('y', Y[l] + 4);
    t.setAttribute('class', 'lvl-label'); t.setAttribute('text-anchor', 'start');
    t.textContent = levelLabels[l];
    // place label to the far left, above the row's nodes
    t.setAttribute('y', Y[l] - 34);
    svg.appendChild(t);
  });

  function drawEdge(x1,y1,x2,y2,color) {
    var mY = (y1 + y2) / 2;
    var p = document.createElementNS(ns, 'path');
    p.setAttribute('d', 'M ' + x1 + ' ' + y1 + ' C ' + x1 + ' ' + mY + ', ' + x2 + ' ' + mY + ', ' + x2 + ' ' + y2);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', color);
    p.setAttribute('stroke-width', 1.3);
    p.setAttribute('opacity', 0.55);
    svg.appendChild(p);
  }

  function drawNode(n, level, y) {
    var w = level === 0 ? 108 : level === 1 ? 128 : level === 2 ? 150 : 170;
    var h = level === 0 ? 44 : 48;
    var color = n.fn ? colors[n.fn] : '#EAF6F8';
    var g = document.createElementNS(ns, 'g');
    g.setAttribute('class', 'nodebox');
    g.setAttribute('color', color);
    var rect = document.createElementNS(ns, 'rect');
    rect.setAttribute('class', 'card');
    rect.setAttribute('x', n.x - w/2); rect.setAttribute('y', y - h/2);
    rect.setAttribute('width', w); rect.setAttribute('height', h);
    rect.setAttribute('stroke', color); rect.setAttribute('stroke-opacity', 0.55);
    g.appendChild(rect);
    // corner brackets
    [[n.x-w/2,y-h/2,1,1],[n.x+w/2,y-h/2,-1,1],[n.x-w/2,y+h/2,1,-1],[n.x+w/2,y+h/2,-1,-1]].forEach(function(c) {
      var cl = document.createElementNS(ns, 'path');
      var cx=c[0], cy=c[1], dx=c[2]*7, dy=c[3]*7;
      cl.setAttribute('d', 'M ' + (cx+dx) + ' ' + cy + ' L ' + cx + ' ' + cy + ' L ' + cx + ' ' + (cy+dy));
      cl.setAttribute('class', 'c'); cl.setAttribute('fill','none'); cl.setAttribute('stroke-width', 1.5);
      g.appendChild(cl);
    });
    var t1 = document.createElementNS(ns, 'text');
    t1.setAttribute('x', n.x); t1.setAttribute('y', y - 2);
    t1.setAttribute('text-anchor', 'middle'); t1.setAttribute('class', 'lbl-main');
    t1.setAttribute('fill', '#EAF6F8'); t1.setAttribute('font-size', level >= 2 ? 12.5 : 11);
    t1.textContent = n.label;
    g.appendChild(t1);
    var t2 = document.createElementNS(ns, 'text');
    t2.setAttribute('x', n.x); t2.setAttribute('y', y + 13);
    t2.setAttribute('text-anchor', 'middle'); t2.setAttribute('class', 'lbl-sub');
    t2.setAttribute('fill', color); t2.setAttribute('font-size', 8.5);
    t2.textContent = n.sub;
    g.appendChild(t2);
    svg.appendChild(g);
  }

  // draw edges first (so nodes sit on top), then nodes level by level
  [L1, L2, L3].forEach(function(level, idx) {
    var y = Y[idx+1];
    var childY = Y[idx];
    level.forEach(function(n) {
      n.parents.forEach(function(pid) {
        var parentNode = byId[pid];
        var color = n.fn ? colors[n.fn] : (parentNode.fn ? colors[parentNode.fn] : '#5EE6FF');
        drawEdge(parentNode.x, childY, n.x, y, color);
      });
    });
  });

  L0.forEach(function(n) { drawNode(n, 0, Y[0]); });
  L1.forEach(function(n) { drawNode(n, 1, Y[1]); });
  L2.forEach(function(n) { drawNode(n, 2, Y[2]); });
  L3.forEach(function(n) { drawNode(n, 3, Y[3]); });
})();
</script>
